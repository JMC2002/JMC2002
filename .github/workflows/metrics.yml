name: GitHub Metrics

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Personal metrics with organization repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: JMC2002
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Shanghai
          repositories_forks: no
          repositories_affiliations: owner, collaborator, organization_member
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_indepth_custom: JMC-Mods/SlayTheSpire2-BetterMap, JMC-Mods/SlayTheSpire2_AllCardIs, JMC-Mods/SlayTheSpire2_MathTheSpire, JMC-Mods/SlayTheSpire2_JmcModLib, JMC-Mods/SlayTheSpire2_LogConsole, JMC-Mods/SlayTheSpire2_TeamHandView, JMC-Mods/SlayTheSpire2_QuickSL, JMC-Mods/SlayTheSpire2_JmcModLibDemo, JMC-Mods/SlayTheSpire2_BetterSaveSlots, JMC-Mods/SlayTheSpire2_SpireGuard, JMC-Mods/SlayTheSpire2_CrashGuard
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 10
          plugin_languages_sections: most-used, recently-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_categories: markup, programming
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 365
          plugin_languages_recent_load: 400
          plugin_repositories: yes
          plugin_repositories_pinned: 4
          plugin_repositories_random: 4
          plugin_repositories_order: pinned, random
          plugin_repositories_forks: no
          plugin_repositories_affiliations: owner, collaborator, organization_member

      - name: JMC-Mods organization metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.jmc-mods.svg
          user: JMC-Mods
          template: classic
          base: header, repositories, metadata
          config_timezone: Asia/Shanghai
          repositories_forks: no
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_analysis_timeout_repositories: 10
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage, lines
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_other: yes
          plugin_languages_categories: markup, programming
          plugin_repositories: yes
          plugin_repositories_pinned: 6
          plugin_repositories_random: 6
          plugin_repositories_order: pinned, random
          plugin_repositories_forks: no
